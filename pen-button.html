<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>레이저 펜 단추</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; }
  #b {
    width: 40px; height: 40px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(24, 24, 32, 0.72); color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.22);
    cursor: pointer; touch-action: none; outline: none;
    transition: background 0.12s ease, transform 0.12s ease;
  }
  #b:hover { background: rgba(24, 24, 32, 0.88); }
  #b:active { transform: scale(0.94); }
  #b.on { background: var(--on, rgb(255, 40, 40)); border-color: rgba(255, 255, 255, 0.6); }
  #b.drag { cursor: grabbing; }
</style>
</head>
<body>
<button id="b" title="레이저 펜 켜기/끄기 · 끌어서 옮기기">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
</button>
<script>
  // 누르면 켜기/끄기, 4px 넘게 끌면 옮기기(놓은 자리 저장)
  const b = document.getElementById('b');
  let start = null, last = null, moved = false;
  b.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    start = last = { x: e.screenX, y: e.screenY };
    moved = false;
    b.setPointerCapture(e.pointerId);
  });
  b.addEventListener('pointermove', (e) => {
    if (!start) return;
    if (!moved && Math.hypot(e.screenX - start.x, e.screenY - start.y) > 4) { moved = true; b.classList.add('drag'); }
    if (moved) {
      const dx = Math.round(e.screenX - last.x), dy = Math.round(e.screenY - last.y);
      if (dx || dy) { window.pb.move(dx, dy); last = { x: last.x + dx, y: last.y + dy }; }
    }
  });
  const end = () => {
    if (!start) return;
    if (moved) window.pb.moved(); else window.pb.toggle();
    start = null; b.classList.remove('drag');
  };
  b.addEventListener('pointerup', end);
  b.addEventListener('pointercancel', () => { if (moved) window.pb.moved(); start = null; b.classList.remove('drag'); });
  b.addEventListener('contextmenu', (e) => e.preventDefault());
  window.pb.onState(({ on, color }) => {
    b.classList.toggle('on', on);
    b.style.setProperty('--on', 'rgb(' + color + ')');
    b.title = on ? '레이저 펜 끝내기 (Esc 도 됨)' : '레이저 펜으로 화면에 쓰기 · 끌어서 옮기기';
  });
</script>
</body>
</html>
