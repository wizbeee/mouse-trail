<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mouse Trail Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    /* 실제 크기는 renderer.js에서 displayInfo 기반으로 강제 지정 */
  }
  #toast {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    padding: 12px 22px;
    border-radius: 12px;
    background: rgba(20, 20, 28, 0.82);
    color: #fff;
    font: 600 18px "Pretendard", "Malgun Gothic", sans-serif;
    letter-spacing: -0.2px;
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  /* 레이저 펜: 쓰는 동안만 마우스를 받음. 완전 투명 픽셀은 클릭이 빠져나갈 수 있어 아주 옅게 칠함 */
  body.pen { background: rgba(0, 0, 0, 0.004); cursor: crosshair; }
  #penBar {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 12px;
    padding: 6px 8px 6px 16px; border-radius: 999px;
    background: rgba(20, 20, 28, 0.78); color: #fff;
    font: 600 14px "Pretendard", "Malgun Gothic", sans-serif;
    cursor: default; user-select: none; white-space: nowrap;
  }
  body.pen #penBar { display: flex; }
  #penEnd {
    min-height: 32px; padding: 0 14px; border-radius: 999px; border: 0;
    background: #fff; color: #1d1d24; font: inherit; cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- 빛나는 커서·레이저·커서 찾기: 매 프레임 지우고 다시 그림(꼬리 잔상과 분리) -->
<canvas id="fx"></canvas>
<div id="toast"></div>
<div id="penBar">레이저 펜 · 쓴 글씨는 잠시 뒤 사라져요 · Esc로 끝내기 <button id="penEnd">끝내기</button></div>
<script src="renderer.js"></script>
</body>
</html>
