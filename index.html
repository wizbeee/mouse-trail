<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mouse Trail Overlay</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0; left: 0;
    /* 실제 크기는 renderer.js에서 displayInfo 기반으로 강제 지정 */
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="renderer.js"></script>
</body>
</html>
